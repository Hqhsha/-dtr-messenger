name: Publish signed Android release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund @capacitor/core@^6 @capacitor/cli@^6 @capacitor/android@^6
      - name: Build web app
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Configure Android media permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          manifest = path.read_text()
          permissions = ["android.permission.CAMERA", "android.permission.RECORD_AUDIO", "android.permission.MODIFY_AUDIO_SETTINGS"]
          additions = "".join(f'    <uses-permission android:name="{permission}" />\n' for permission in permissions if f'android:name="{permission}"' not in manifest)
          if additions:
              manifest = manifest.replace("    <application", additions + "    <application", 1)
              path.write_text(manifest)
          PY
      - name: Decode signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64 repository secret" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dtr-release.jks"
      - name: Build signed APK
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          npx cap sync android
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease -Pandroid.injected.signing.store.file="$RUNNER_TEMP/dtr-release.jks" -Pandroid.injected.signing.store.password="$STORE_PASSWORD" -Pandroid.injected.signing.key.alias="$KEY_ALIAS" -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          name: DTR ${{ github.ref_name }}
          generate_release_notes: true
          files: android/app/build/outputs/apk/release/app-release.apk
