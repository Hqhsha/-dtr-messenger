name: Build and publish signed Android APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund @capacitor/core@^6 @capacitor/cli@^6 @capacitor/android@^6

      - name: Build web app
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Configure Android media permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          manifest = path.read_text()
          permissions = [
              "android.permission.CAMERA",
              "android.permission.RECORD_AUDIO",
              "android.permission.MODIFY_AUDIO_SETTINGS",
          ]
          additions = "".join(
              f'    <uses-permission android:name="{permission}" />\\n'
              for permission in permissions
              if f'android:name="{permission}"' not in manifest
          )
          if additions:
              manifest = manifest.replace("    <application", additions + "    <application", 1)
              path.write_text(manifest)
          PY

      - name: Set Android version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="0.7.3"
          fi
          VERSION_CODE="$(python3 -c 'import sys; a=list(map(int,sys.argv[1].split("."))); print(a[0]*1000000+a[1]*1000+a[2])' "$VERSION_NAME")"
          python3 - "$VERSION_CODE" "$VERSION_NAME" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path("android/app/build.gradle")
          content = path.read_text()
          content, count = re.subn(
              r'(defaultConfig\\s*\\{)',
              r'\\1\\n        versionCode ' + sys.argv[1] + '\\n        versionName "' + sys.argv[2] + '"',
              content,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not set Android versionCode/versionName")
          path.write_text(content)
          PY

      - name: Decode signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64 repository secret" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dtr-release.jks"
          test -s "$RUNNER_TEMP/dtr-release.jks"

      - name: Build signed APK
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$STORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)
          npx cap sync android
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease -Pandroid.injected.signing.store.file="$RUNNER_TEMP/dtr-release.jks" -Pandroid.injected.signing.store.password="$STORE_PASSWORD" -Pandroid.injected.signing.key.alias="$KEY_ALIAS" -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DTR-Android-APK-signed
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: DTR ${{ github.ref_name }}
          generate_release_notes: true
          files: android/app/build/outputs/apk/release/app-release.apk
