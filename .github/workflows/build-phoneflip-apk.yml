name: Build DTR Phone Flip APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'phone-flip-android/**'
      - '.github/workflows/build-phoneflip-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" package no longer exists in Google's SDK repo.
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
        working-directory: phone-flip-android
      - uses: actions/upload-artifact@v4
        with:
          name: DTR-Phone-Flip-debug-apk
          path: phone-flip-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
