<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Phone Flip — Smartphone UI</title>
<style>
:root{--bg:#090b12;--panel:#141824;--panel2:#1b2130;--text:#f4f5fa;--muted:#9299ad;--accent:#9b7cff;--green:#63dba1;--line:#ffffff13}
*{box-sizing:border-box}body{margin:0;background:#080a10;color:var(--text);font:14px/1.35 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100dvh;display:grid;place-items:center;padding:18px}
.phone{width:min(100%,390px);height:min(850px,calc(100dvh - 36px));min-height:570px;border:1px solid #333849;border-radius:38px;background:#111521;overflow:hidden;position:relative;box-shadow:0 30px 90px #0009}
.status{height:42px;padding:12px 25px 5px;display:flex;justify-content:space-between;font-size:12px;font-weight:650;position:relative;z-index:4}.status .right{letter-spacing:3px}
.screen{height:calc(100% - 42px);position:relative;background:radial-gradient(ellipse at 80% 12%,#413067 0,transparent 38%),radial-gradient(ellipse at 10% 70%,#1a3a4b 0,transparent 42%),linear-gradient(145deg,#111827,#080b12 75%);padding:20px 20px 16px}
.homeHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.date{color:#c5c8d5;font-size:13px}.clock{font-size:38px;font-weight:300;letter-spacing:-1.5px}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 10px}.app{border:0;background:none;color:white;padding:0;text-align:center;cursor:pointer;min-width:0}.app:active{transform:scale(.92)}.appIcon{width:56px;height:56px;border-radius:17px;margin:0 auto 7px;display:grid;place-items:center;font-size:25px;box-shadow:inset 0 1px #ffffff25,0 7px 18px #0003}.app span{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 4px #000}
.market{background:linear-gradient(145deg,#38a5a0,#13645f)}.workshop{background:linear-gradient(145deg,#f4a94f,#a95a24)}.courier{background:linear-gradient(145deg,#6b9dff,#3653a8)}.bank{background:linear-gradient(145deg,#55d7a0,#187c55)}.reviews{background:linear-gradient(145deg,#f5ce68,#b57c24)}.settings{background:linear-gradient(145deg,#9298aa,#41495e)}.phoneApp{background:linear-gradient(145deg,#55d78d,#187b4c)}.messages{background:linear-gradient(145deg,#68a8ff,#2460c7)}.camera{background:linear-gradient(145deg,#b5bbc8,#525d70)}.browser{background:linear-gradient(145deg,#8f7dff,#5142b5)}.clockApp{background:linear-gradient(145deg,#34445c,#1b2738)}.notes{background:linear-gradient(145deg,#ffe08a,#c68c30)}.games{background:linear-gradient(145deg,#ee83b8,#9b3d76)}.files{background:linear-gradient(145deg,#80c7d8,#347e99)}
.widget{margin:26px 0 18px;padding:15px 16px;border:1px solid #ffffff17;border-radius:22px;background:#ffffff0b;backdrop-filter:blur(16px)}.widgetTop{display:flex;justify-content:space-between;color:#c9cce0;font-size:12px}.balance{font-size:23px;font-weight:650;margin-top:8px}.widget small{color:var(--muted)}
.dock{position:absolute;left:20px;right:20px;bottom:20px;padding:12px 10px;border:1px solid #ffffff19;border-radius:25px;background:#ffffff12;backdrop-filter:blur(20px);display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.overlay{position:absolute;inset:0;background:#0c1019;z-index:5;display:none;flex-direction:column}.overlay.open{display:flex}.appbar{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}.back{width:36px;height:36px;border:0;border-radius:13px;background:#ffffff10;color:white;font-size:22px;cursor:pointer}.appbar h2{font-size:18px;margin:0;flex:1}.appbar .sub{font-size:11px;color:var(--muted)}.content{padding:16px;overflow:auto;flex:1}.search{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#ffffff08;color:white;margin-bottom:14px;outline:none}
.product{display:flex;gap:13px;padding:12px;border:1px solid var(--line);border-radius:18px;background:var(--panel);margin-bottom:11px}.device{width:74px;height:105px;flex-shrink:0;border-radius:14px;background:linear-gradient(145deg,#313b50,#0d1119);display:grid;place-items:center;position:relative;border:2px solid #4c5363;overflow:hidden}.device:before{content:"";width:46px;height:83px;border-radius:9px;background:linear-gradient(135deg,#6c7f9d,#20283b);border:2px solid #090c12;box-shadow:inset 0 0 0 2px #ffffff20}.device:after{content:"";position:absolute;top:12px;left:15px;width:8px;height:8px;border-radius:50%;background:#111827;box-shadow:13px 0 #111827,0 13px #111827,13px 13px #111827}
.device.cracked .cracks{position:absolute;inset:0;background:linear-gradient(132deg,transparent 43%,#eaf4ffdd 44%,transparent 45%),linear-gradient(35deg,transparent 53%,#eaf4ffbb 54%,transparent 55%),linear-gradient(87deg,transparent 62%,#eaf4ffcc 63%,transparent 64%),linear-gradient(155deg,transparent 29%,#eaf4ff99 30%,transparent 31%);filter:drop-shadow(0 0 1px #fff)}
.pinfo{flex:1;min-width:0}.pinfo h3{font-size:14px;margin:1px 0 5px}.price{font-size:17px;font-weight:750;color:#b9a5ff}.condition{font-size:11px;color:var(--muted);margin:4px 0 9px}.buy{border:0;border-radius:10px;background:var(--accent);color:#11101a;font-weight:700;padding:7px 12px;cursor:pointer}.buy:active,button:active{filter:brightness(.9)}
.sectionTitle{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:16px 0 9px}.card{padding:15px;border:1px solid var(--line);border-radius:18px;background:var(--panel);margin-bottom:12px}.card h3{margin:0 0 8px;font-size:15px}.card p{margin:0;color:#c4c8d6;line-height:1.5}.stars{color:#ffcf63;letter-spacing:2px;margin-bottom:7px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.bigMoney{font-size:25px;font-weight:750}.muted{color:var(--muted)}.primary{border:0;border-radius:13px;background:var(--accent);color:#171322;font-weight:750;padding:12px 14px;cursor:pointer}.secondary{border:1px solid var(--line);border-radius:13px;background:#ffffff0a;color:white;padding:10px 12px;cursor:pointer}.full{width:100%;margin-top:10px}.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat .card{margin:0}.bar{height:7px;border-radius:9px;background:#ffffff12;overflow:hidden;margin-top:9px}.bar i{display:block;height:100%;background:var(--green);width:68%;border-radius:9px}.setting{padding:14px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.toggle{accent-color:var(--accent);width:20px;height:20px}
.toast{position:absolute;z-index:10;bottom:25px;left:18px;right:18px;background:#252b3b;border:1px solid #ffffff22;border-radius:14px;padding:13px 15px;text-align:center;display:none;box-shadow:0 8px 30px #0008}.toast.show{display:block}
@media(max-height:650px){.screen{padding-top:10px}.homeHead{margin-bottom:12px}.apps{gap:12px 8px}.appIcon{width:48px;height:48px;border-radius:15px}.widget{margin:14px 0}.dock{bottom:12px}}
</style>
</head>
<body><main class="phone"><div class="status"><span id="statusTime">9:41</span><span class="right">◈ ▮▮ ▰</span></div><div class="screen" id="home">
<div class="homeHead"><div><div class="date" id="date">Четверг, 26 ноября</div><div class="clock" id="clock">09:41</div></div><div style="font-size:24px">☁️</div></div>
<div class="apps">
<button class="app" data-app="market"><div class="appIcon market">🛍️</div><span>TelBuy</span></button>
<button class="app" data-app="workshop"><div class="appIcon workshop">🔧</div><span>Мастерская</span></button>
<button class="app" data-app="courier"><div class="appIcon courier">🛵</div><span>Курьер</span></button>
<button class="app" data-app="bank"><div class="appIcon bank">💳</div><span>Банк</span></button>
<button class="app" data-app="reviews"><div class="appIcon reviews">⭐</div><span>Отзывы</span></button>
<button class="app" data-app="settings"><div class="appIcon settings">⚙️</div><span>Настройки</span></button>
<button class="app" data-app="clock"><div class="appIcon clockApp">🕒</div><span>Часы</span></button>
<button class="app" data-app="notes"><div class="appIcon notes">📝</div><span>Заметки</span></button>
<button class="app" data-app="games"><div class="appIcon games">🎮</div><span>Игры</span></button>
<button class="app" data-app="files"><div class="appIcon files">📁</div><span>Файлы</span></button>
<button class="app" data-app="messages"><div class="appIcon messages">💬</div><span>Сообщения</span></button>
<button class="app" data-app="browser"><div class="appIcon browser">🌐</div><span>Браузер</span></button>
</div>
<div class="widget"><div class="widgetTop"><span>МОЙ СЧЁТ</span><span>•••</span></div><div class="balance" id="homeBalance">₽ 25 000</div><small>Доступно для покупок</small></div>
<div class="dock">
<button class="app" data-app="phone"><div class="appIcon phoneApp">📞</div><span>Телефон</span></button>
<button class="app" data-app="messages"><div class="appIcon messages">💬</div><span>Чаты</span></button>
<button class="app" data-app="camera"><div class="appIcon camera">📷</div><span>Камера</span></button>
<button class="app" data-app="browser"><div class="appIcon browser">🌐</div><span>Интернет</span></button>
</div>
</div><section class="overlay" id="overlay"><header class="appbar"><button class="back" id="back">‹</button><div style="flex:1"><h2 id="appTitle">Приложение</h2><div class="sub" id="appSub">Phone Flip OS</div></div><span>•••</span></header><div class="content" id="content"></div></section><div class="toast" id="toast"></div></main>
<script>
const $=s=>document.querySelector(s);
const seedProducts=[{id:1,name:"Galaxy S22",price:18500,condition:"Как новый",quality:95,broken:false},{id:2,name:"iPhone 11",price:14200,condition:"Хорошее состояние",quality:78,broken:false},{id:3,name:"Pixel 6",price:8900,condition:"Битый экран",quality:42,broken:true},{id:4,name:"iPhone 13",price:27900,condition:"Отличное состояние",quality:91,broken:false},{id:5,name:"Redmi Note 12",price:6500,condition:"Потёртый корпус",quality:68,broken:false},{id:6,name:"Galaxy A52",price:7200,condition:"Не включается",quality:35,broken:true}];
const initial={money:25000,inventory:[],repairs:0,deliveries:0,rating:4.7,reviews:[],bonusClaimed:false,level:1,xp:0,note:"",settings:{dark:true,vibration:true,notifications:true},dailyJobs:0};
let state;try{state=Object.assign({},initial,JSON.parse(localStorage.getItem("dtr_phoneflip_save")||"{}"));}catch(e){state=Object.assign({},initial)}
if(!Array.isArray(state.inventory))state.inventory=[];if(!Array.isArray(state.reviews))state.reviews=[];if(!state.settings)state.settings=initial.settings;
let products=seedProducts.map(p=>Object.assign({},p));
function save(){localStorage.setItem("dtr_phoneflip_save",JSON.stringify(state));refresh()}
function fmt(n){return "₽ "+Math.round(n).toLocaleString("ru-RU")}
function toast(t){let e=$("#toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2200)}
function refresh(){$("#homeBalance").textContent=fmt(state.money);let level=$("#levelTag");if(level)level.textContent="Уровень "+state.level}
function earn(n,xp){state.money+=n;state.xp+=(xp||1);if(state.xp>=state.level*5){state.xp-=state.level*5;state.level++;toast("Новый уровень: "+state.level+"!")}save()}
function openApp(name){let titles={market:"TelBuy · Маркет",workshop:"Мастерская",courier:"Курьер",bank:"Банк",reviews:"Отзывы",settings:"Настройки",clock:"Часы",notes:"Заметки",games:"Мини-игры",files:"Файлы",phone:"Телефон",messages:"Сообщения",camera:"Камера",browser:"Браузер"};$("#appTitle").textContent=titles[name]||name;$("#appSub").textContent="DTR · Phone Flip";$("#overlay").classList.add("open");render(name)}
function render(name){const c=$("#content");
if(name==="market"){c.innerHTML='<div class="row"><div class="muted">Покупай, ремонтируй и продавай телефоны.</div><b id="levelTag">Уровень '+state.level+'</b></div><input class="search" id="search" placeholder="Поиск телефонов…"><div class="sectionTitle">Объявления</div><div id="products"></div><div class="sectionTitle">Мои телефоны · '+state.inventory.length+'</div><div id="myPhones"></div>';drawProducts(products);drawInventory();$("#search").oninput=e=>drawProducts(products.filter(p=>(p.name+p.condition).toLowerCase().includes(e.target.value.toLowerCase())))}
else if(name==="reviews"){c.innerHTML='<div class="row"><div><div class="bigMoney">'+state.rating.toFixed(1)+' ★</div><div class="muted">Рейтинг продавца</div></div><button class="primary" id="writeReview">Оставить отзыв</button></div><div class="sectionTitle">Отзывы</div><div id="reviewList"></div>';drawReviews();$("#writeReview").onclick=()=>{let stars=1+Math.floor(Math.random()*5),msgs=["Сделка прошла отлично!","Телефон соответствует описанию.","Хорошая цена и быстрая доставка.","Есть небольшие недочёты, но продавец помог."];state.reviews.unshift(["Покупатель "+(state.reviews.length+1),stars,msgs[Math.floor(Math.random()*msgs.length)]]);state.rating=Math.max(1,Math.min(5,+(state.rating+(stars-3)*.06).toFixed(1)));save();render(name);toast("Отзыв опубликован")}}
else if(name==="bank"){c.innerHTML='<div class="card"><div class="muted">Баланс счёта</div><div class="bigMoney">'+fmt(state.money)+'</div><p>Игровой счёт DTR</p></div><div class="stat"><div class="card"><div class="muted">Телефонов</div><div class="bigMoney">'+state.inventory.length+'</div></div><div class="card"><div class="muted">Прибыль от работ</div><div class="bigMoney">'+state.deliveries*750+'</div></div></div><button class="primary full" id="bonus">'+(state.bonusClaimed?"Бонус уже получен":"Получить стартовый бонус +₽500")+'</button>';$("#bonus").onclick=()=>{if(state.bonusClaimed){toast("Бонус уже получен");return}state.bonusClaimed=true;earn(500,1);render(name);toast("Бонус +₽500")}}
else if(name==="workshop"){c.innerHTML='<div class="card"><div class="muted">Опыт мастерской</div><div class="bigMoney">'+state.repairs+' ремонтов</div><p>Выбери повреждённый телефон из инвентаря и восстанови его.</p></div><div id="repairList"></div>';let el=$("#repairList");if(!state.inventory.length)el.innerHTML='<div class="card"><p>Сначала купи телефон в TelBuy.</p></div>';else el.innerHTML=state.inventory.map(p=>'<div class="card"><h3>'+p.name+'</h3><p>'+p.condition+' · качество '+p.quality+'%</p><button class="primary full" data-repair="'+p.uid+'">Ремонт за '+fmt(p.broken?2500:1200)+'</button></div>').join("");el.querySelectorAll("[data-repair]").forEach(b=>b.onclick=()=>{let p=state.inventory.find(x=>x.uid===b.dataset.repair);if(!p)return;let cost=p.broken?2500:1200;if(state.money<cost){toast("Недостаточно средств");return}state.money-=cost;p.broken=false;p.quality=Math.min(100,p.quality+35);p.condition="После ремонта · "+p.quality+"%";p.value=Math.round(p.value*1.35);state.repairs++;state.xp++;save();render(name);toast("Телефон восстановлен!")})}
else if(name==="courier"){c.innerHTML='<div class="card"><div style="font-size:40px">🛵</div><h3>Доставка заказов</h3><p>Выполняй заказы, чтобы заработать деньги и опыт.</p><div class="bigMoney">+₽750</div><button class="primary full" id="deliver">Выполнить доставку</button></div><div class="card"><div class="muted">Доставлено</div><div class="bigMoney">'+state.deliveries+'</div><div class="bar"><i style="width:'+Math.min(100,state.dailyJobs*20)+'%"></i></div><p>Заказов в серии: '+state.dailyJobs+'</p></div>';$("#deliver").onclick=()=>{state.deliveries++;state.dailyJobs++;earn(750,2);render(name);toast("Доставка выполнена · +₽750")}}
else if(name==="settings"){c.innerHTML='<div class="setting"><span>Тёмная тема</span><input class="toggle" type="checkbox" data-setting="dark" '+(state.settings.dark?"checked":"")+'></div><div class="setting"><span>Вибрация кнопок</span><input class="toggle" type="checkbox" data-setting="vibration" '+(state.settings.vibration?"checked":"")+'></div><div class="setting"><span>Уведомления</span><input class="toggle" type="checkbox" data-setting="notifications" '+(state.settings.notifications?"checked":"")+'></div><div class="card" style="margin-top:18px"><h3>DTR Phone Flip</h3><p>Сохранение автоматически хранится на устройстве.</p><button class="secondary full" id="resetSave">Сбросить прогресс</button></div>';c.querySelectorAll("[data-setting]").forEach(x=>x.onchange=()=>{state.settings[x.dataset.setting]=x.checked;save()});$("#resetSave").onclick=()=>{if(confirm("Удалить весь игровой прогресс?")){localStorage.removeItem("dtr_phoneflip_save");location.reload()}}}
else if(name==="clock"){c.innerHTML='<div class="card" style="text-align:center;padding:35px 12px"><div class="muted">Время устройства</div><div class="clock" id="largeClock">--:--</div><p>Игровой смартфон DTR</p></div>'}
else if(name==="notes"){c.innerHTML='<textarea id="note" class="search" style="height:190px;resize:vertical" placeholder="Напиши заметку…">'+state.note.replace(/</g,"&lt;")+'</textarea><button class="primary full" id="saveNote">Сохранить заметку</button>';$("#saveNote").onclick=()=>{state.note=$("#note").value;save();toast("Заметка сохранена")}}
else if(name==="games"){c.innerHTML='<div class="card"><h3>🎲 Угадай число</h3><p>Угадай число от 1 до 5. За победу +₽100.</p><input class="search" id="guess" type="number" min="1" max="5" placeholder="Число 1–5"><button class="primary full" id="guessBtn">Проверить</button></div><div class="card"><h3>🪙 Монетка</h3><p>Выбери сторону. Верный выбор приносит ₽50.</p><div class="row"><button class="secondary" id="heads">Орёл</button><button class="secondary" id="tails">Решка</button></div></div>';$("#guessBtn").onclick=()=>{let v=Number($("#guess").value),n=1+Math.floor(Math.random()*5);if(v===n){earn(100,1);toast("Угадал! +₽100")}else toast("Выпало "+n+" — попробуй ещё")};function flip(choice){let n=Math.random()<.5?"heads":"tails";if(n===choice){earn(50,1);toast("Угадал! +₽50")}else toast("Не угадал — "+(n==="heads"?"орёл":"решка"))}$("#heads").onclick=()=>flip("heads");$("#tails").onclick=()=>flip("tails")}
else if(name==="files"){c.innerHTML='<div class="card"><div class="row"><span>📦 Сохранение игры</span><span class="muted">Авто</span></div><p>Баланс: '+fmt(state.money)+' · Телефонов: '+state.inventory.length+'</p></div><button class="secondary full" id="exportSave">Экспорт сохранения</button><input type="file" id="importSave" accept="application/json" class="search" style="margin-top:12px"><button class="primary full" id="importBtn">Импорт сохранения</button>';$("#exportSave").onclick=()=>{let a=document.createElement("a"),blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});a.href=URL.createObjectURL(blob);a.download="dtr-save.json";a.click();URL.revokeObjectURL(a.href)};$("#importBtn").onclick=()=>{let f=$("#importSave").files[0];if(!f){toast("Выбери файл сохранения");return}let rd=new FileReader();rd.onload=()=>{try{state=Object.assign({},initial,JSON.parse(rd.result));save();toast("Сохранение загружено");render(name)}catch(e){toast("Файл сохранения повреждён")}};rd.readAsText(f)}}
else if(name==="phone"){c.innerHTML='<div class="card"><h3>📞 Телефон</h3><p>Игровой набор номера.</p><input class="search" id="dial" type="tel" placeholder="Введите номер"><button class="primary full" id="call">Позвонить</button></div>';$("#call").onclick=()=>toast("В игровом мире вызов: "+($("#dial").value||"неизвестный номер"))}
else if(name==="messages"){c.innerHTML='<div class="card"><h3>Сообщения</h3><p>Поддержка TelBuy: добро пожаловать! Удачных сделок.</p></div><div class="card"><h3>Покупатель</h3><p>Здравствуйте! Есть ли скидка на телефон?</p><button class="secondary full" id="reply">Ответить</button></div>';$("#reply").onclick=()=>toast("Ответ отправлен: цена окончательная")}
else if(name==="camera"){c.innerHTML='<div class="card" style="text-align:center;padding:40px 10px"><div style="font-size:60px">📷</div><h3>Камера</h3><p>Сделай игровое фото для карточки телефона.</p><button class="secondary" id="snap">Сделать снимок</button></div>';$("#snap").onclick=()=>{state.xp++;save();toast("Фото сохранено в игровую галерею")}}
else{c.innerHTML='<div class="card"><h3>Браузер</h3><p>Внутриигровые объявления и справка.</p><input class="search" id="webSearch" placeholder="Поиск в игровом интернете"><button class="primary full" id="searchWeb">Найти</button><p id="webResult"></p></div>';$("#searchWeb").onclick=()=>$("#webResult").textContent="Результаты по запросу: "+($("#webSearch").value||"DTR")+" · TelBuy, доставка, мастерская"}
}
function drawProducts(list){let el=$("#products");if(!el)return;el.innerHTML=list.map(p=>'<div class="product"><div class="device '+(p.broken?"cracked":"")+'">'+(p.broken?'<i class="cracks"></i>':'')+'</div><div class="pinfo"><h3>'+p.name+'</h3><div class="price">'+fmt(p.price)+'</div><div class="condition">'+p.condition+'</div><button class="buy" data-buy="'+p.id+'">Купить</button></div></div>').join("");el.querySelectorAll("[data-buy]").forEach(b=>b.onclick=()=>{let p=products.find(x=>x.id===+b.dataset.buy);if(!p||state.money<p.price){toast("Недостаточно средств");return}state.money-=p.price;state.inventory.push({uid:String(Date.now())+Math.random().toString(16).slice(2),name:p.name,condition:p.condition,quality:p.quality,broken:p.broken,value:Math.round(p.price*(p.broken?1.25:1.15)),cost:p.price});save();drawInventory();toast("Куплен "+p.name+" · −"+fmt(p.price))})}
function drawInventory(){let el=$("#myPhones");if(!el)return;if(!state.inventory.length){el.innerHTML='<div class="card"><p>Пока нет телефонов. Купи первый в объявлениях.</p></div>';return}el.innerHTML=state.inventory.map(p=>'<div class="product"><div class="device '+(p.broken?"cracked":"")+'">'+(p.broken?'<i class="cracks"></i>':'')+'</div><div class="pinfo"><h3>'+p.name+'</h3><div class="price">Цена продажи '+fmt(p.value)+'</div><div class="condition">'+p.condition+'</div><button class="buy" data-sell="'+p.uid+'">Продать</button></div></div>').join("");el.querySelectorAll("[data-sell]").forEach(b=>b.onclick=()=>{let i=state.inventory.findIndex(p=>p.uid===b.dataset.sell);if(i<0)return;let p=state.inventory.splice(i,1)[0];let gain=Math.max(100,Math.round(p.value*(p.broken ? 0.72 : 1)));earn(gain,2);toast("Продано за "+fmt(gain));drawInventory()})}
function drawReviews(){let el=$("#reviewList");if(!el)return;let list=state.reviews.concat([["Артём",5,"Отличный продавец, телефон в идеале!"],["Мария",4,"Всё честно, цена хорошая."],["Денис",5,"Быстрая сделка, рекомендую."]]);el.innerHTML=list.slice(0,8).map(r=>'<div class="card"><b>'+r[0]+'</b><div class="stars">'+("★".repeat(r[1]))+("☆".repeat(5-r[1]))+'</div><p>'+r[2]+'</p></div>').join("")}
document.querySelectorAll("[data-app]").forEach(b=>b.addEventListener("click",()=>openApp(b.dataset.app)));$("#back").onclick=()=>$("#overlay").classList.remove("open");
function tick(){let d=new Date(),t=d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});$("#clock").textContent=t;$("#statusTime").textContent=t;$("#date").textContent=d.toLocaleDateString("ru-RU",{weekday:"long",day:"numeric",month:"long"});let lc=$("#largeClock");if(lc)lc.textContent=t}tick();setInterval(tick,15000);refresh();
</script></body></html>
